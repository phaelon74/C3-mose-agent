[llm]
# LLM settings are supplied via environment variables (not this file):
# LLM_ENDPOINT, LLM_MODEL, LLM_MAX_TOKENS, LLM_TEMPERATURE,
# LLM_OMIT_TEMPERATURE, LLM_CONTEXT_WINDOW, LLM_API_KEY, LLM_PROVIDER.
# Defaults when unset are defined in mose/config.py (LLMConfig).

[discord]
# token loaded from DISCORD_TOKEN env var

[signal]
# phone_number: linked account (SIGNAL_PHONE) — signal-cli -a; not a chat destination.
# engagement_group_id / admin_group_id: base64 group ids (SIGNAL_ENGAGEMENT_GROUP_ID,
# SIGNAL_ADMIN_GROUP_ID). See INSTALL.md section E.  Daemon is Docker Bridge.
daemon_host = "172.17.0.1"
daemon_port = 7583
proposal_timeout_seconds = 43200   # 12 hours

[memory]
db_path = "data/memory.db"
embedding_model = "nomic-ai/nomic-embed-text-v1.5"
embedding_dimensions = 384
top_k = 10
chunk_size = 500
summary_interval = 8
rrf_k = 60
importance_threshold = 3.0
recency_weight = 0.3

[agent]
workspace = "data/workspace"
allow_read_outside = true
skills_path = "skills"
recent_messages_limit = 15
# Merge MCP tool schemas into the main LLM tool list when MCP servers are configured.
# With Code Mode, `mcp_servers.json` should define only `mcp-portal` (two tools). The
# `inline_mcp_tools` flag is legacy and ignored by the agent — MCP tools are always merged.
inline_mcp_tools = false
# Restrict merged tools to named MCP servers only (optional). Example:
# inline_mcp_servers = ["mcp-portal"]
# inline_mcp_servers = []
# Legacy soft cap (no longer enforced; kept for operator reference).
inline_mcp_tools_soft_cap = 200

[terminal]
# "local" for dev; "docker" when agent container uses docker.sock to exec into mose-sandbox
backend = "local"
container = "mose-sandbox"
workspace_mount = "/workspace"

[learning]
# The agent NEVER auto-builds a skill. A proposal is drafted and a human must
# approve via Signal (or the CLI) before the skill body is generated.
enabled = true
pending_dir = "skills/pending"
rejected_dir = "skills/rejected"
approval_required = true       # kept for compatibility, always enforced
min_tools_used = 3             # only propose after this many native tool calls
skill_loading_mode = "full"    # full | level_0 (index-only for token thrift)
# Periodic skill-quality review (writes Markdown report + structured log events)
skill_review_failure_threshold = 0.3
review_interval_hours = 168     # 1 week
review_min_samples = 5          # require at least N uses before flagging
review_log_dir = "data/logs"
review_startup_delay_seconds = 300
# Startup grace window for approved-but-unbuilt skills (crashed mid-draft).
# The admin is notified and the build auto-starts after this delay unless
# they reply "stop <slug>" or "cancel <slug>". Default: 15 minutes.
build_grace_window_seconds = 900

[trackers]
enabled = true
sample_retention_days = 90
rollup_retention_days = 730
default_schedule_seconds = 5
snapshot_interval_seconds = 300
failure_threshold = 30
compaction_interval_hours = 6
reconcile_interval_seconds = 60
code_timeout_seconds = 60

[scheduler]
enabled = true
timezone = "America/Chicago"
reconcile_interval_seconds = 60
run_timeout_seconds = 600
max_concurrent_runs = 1
failure_threshold = 5
default_recipient = "signal:admin"
run_retention_days = 90

[upcoming]
enabled = true
daily_hour = 5
weekly_weekday = "monday"
weekly_hour = 9
# timezone empty → inherit [scheduler].timezone
sync_max_age_hours = 26
recommendation_horizon_days = 180
min_popularity = 5.0
min_vote_count = 20
cap_movies = 40
cap_tv = 40
cap_anime = 20
failure_threshold = 3
# Auto-discover Sonarr TV vs Anime folders by path substring:
sonarr_tv_root_match = "/TV"
sonarr_anime_root_match = "/Anime"
# Optional explicit paths / profile ids (0 = first profile from *arr):
# sonarr_tv_root_path = ""
# sonarr_anime_root_path = ""
# radarr_root_path = ""
# radarr_quality_profile_id = 0
# sonarr_tv_quality_profile_id = 0
# sonarr_anime_quality_profile_id = 0

[portal]
# When enabled, mose-agent listens on approval_bridge_port for POST /approve (Code Mode mutating MCP).
enabled = false
approval_bridge_host = "0.0.0.0"
approval_bridge_port = 9100
code_timeout_seconds = 30
code_max_timeout = 120

[observe]
log_dir = "data/logs"
log_level = "INFO"
web_dashboard = false
web_port = 8900
