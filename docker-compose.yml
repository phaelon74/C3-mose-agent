# Mose agent + isolated shell sandbox, for a Linux Docker host.
#
# Prerequisites on the host:
#   - Docker Engine >= 24
#   - The deploying user is in the `docker` group
#   - Build-time:  DOCKER_GID=$(getent group docker | cut -d: -f3)
#   - Runtime:     LLM_ENDPOINT points at a local OpenAI-compatible server
#                  (TabbyAPI, vLLM, llama.cpp server, ...)
#
# Bring up (agent + sandbox + Code Mode portal + optional Plex + arr MCP sidecars; see INSTALL.md D):
#   export DOCKER_GID=$(getent group docker | cut -d: -f3)
#   docker compose build mose-sandbox mose-agent mose-mcp-portal mose-mcp-codemode-sandbox plex-ops-admin plex-stack-automation sonarr-diagnostics radarr-diagnostics nzbget-diagnostics
#   docker compose up -d mose-sandbox mose-agent mose-mcp-portal mose-mcp-codemode-sandbox plex-ops-admin plex-stack-automation sonarr-diagnostics radarr-diagnostics nzbget-diagnostics
#
# Periodic skill review (run from a systemd timer on the host):
#   docker compose run --rm mose-skill-review

services:
  # Code Mode: Deno isolate per `portal_codemode_execute` call (portal `docker exec`s here).
  mose-mcp-codemode-sandbox:
    build:
      context: .
      dockerfile: docker/mcp-codemode-sandbox/Dockerfile
    container_name: mose-mcp-codemode-sandbox
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mose-codemode-net
    restart: unless-stopped

  # MCP portal: aggregates upstream MCPs + WebSocket RPC for the Code Mode sandbox.
  mose-mcp-portal:
    build:
      context: .
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: mose-mcp-portal
    # Idle container: mose-agent connects via `docker exec -i ... python -m mose_portal`.
    # A long-running MCP process here would race the exec'd instance on RPC port 9001.
    command: ["sleep", "infinity"]
    depends_on:
      mose-mcp-codemode-sandbox:
        condition: service_started
      plex-ops-admin:
        condition: service_started
      plex-stack-automation:
        condition: service_started
      sonarr-diagnostics:
        condition: service_started
      radarr-diagnostics:
        condition: service_started
      nzbget-diagnostics:
        condition: service_started
    environment:
      MCP_PORTAL_CONFIG: /app/mcp_servers.portal.json
      MCP_PORTAL_RPC_HOST: mose-mcp-portal
      MCP_PORTAL_RPC_PORT: "9001"
      MCP_PORTAL_SANDBOX_CONTAINER: mose-mcp-codemode-sandbox
      MCP_PORTAL_AGENT_APPROVAL_URL: http://mose-agent:9100/approve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mose-data:/app/data
      - mose-workspace:/app/data/workspace
    networks:
      mose-codemode-net: {}
      mose-net: {}
    restart: unless-stopped

  # Isolated shell target. The agent `exec`s into this container instead of
  # running shell commands directly inside its own container.
  mose-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    container_name: mose-sandbox
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    networks:
      - mose-net
    volumes:
      - mose-workspace:/workspace
    healthcheck:
      test: ["CMD", "bash", "-lc", "test -d /workspace"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Plex MCP (vladimir-tutin) — idle container; mose-agent stdio-bridge via docker exec.
  plex-ops-admin:
    build:
      context: .
      dockerfile: docker/plex-mcp-ops-admin/Dockerfile
    container_name: mose-plex-ops-admin
    networks:
      - mose-net
    environment:
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    restart: unless-stopped

  # Plex + Sonarr + Radarr MCP (niavasha) — idle container; docker exec stdio bridge.
  plex-stack-automation:
    build:
      context: .
      dockerfile: docker/plex-mcp-stack-automation/Dockerfile
    container_name: mose-plex-stack-automation
    networks:
      - mose-net
    environment:
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      # Defense in depth: Mose classifies mutating tools via mose/mcp_write_policy
      # and requires Signal admin approval. Leave upstream mutative ops OFF so a
      # tool that bypasses policy (e.g. direct MCP) can never appear on the wire.
      PLEX_ENABLE_MUTATIVE_OPS: "false"
    restart: unless-stopped

  # Sonarr diagnostics MCP — Python *arr API tools (queue/import/logs/commands).
  # Same image as radarr-diagnostics; env selects Sonarr only.
  sonarr-diagnostics:
    build:
      context: .
      dockerfile: docker/arr-diagnostics/Dockerfile
    image: mose-arr-diagnostics:latest
    container_name: mose-sonarr-diagnostics
    networks:
      - mose-net
    environment:
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
    restart: unless-stopped

  radarr-diagnostics:
    image: mose-arr-diagnostics:latest
    build:
      context: .
      dockerfile: docker/arr-diagnostics/Dockerfile
    container_name: mose-radarr-diagnostics
    networks:
      - mose-net
    environment:
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    restart: unless-stopped

  # NZBGet JSON-RPC MCP — queue / history / diagnostics (Usenet downloader).
  nzbget-diagnostics:
    build:
      context: .
      dockerfile: docker/nzbget-diagnostics/Dockerfile
    container_name: mose-nzbget-diagnostics
    networks:
      - mose-net
    environment:
      NZBGET_HOST: ${NZBGET_HOST:-}
      NZBGET_PORT: ${NZBGET_PORT:-6789}
      NZBGET_USERNAME: ${NZBGET_USERNAME:-nzbget}
      NZBGET_PASSWORD: ${NZBGET_PASSWORD:-}
      NZBGET_USE_HTTPS: ${NZBGET_USE_HTTPS:-false}
    restart: unless-stopped

  # Main agent. Runs as the non-root `mose` user inside the image.
  mose-agent:
    build:
      context: .
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: mose-agent
    depends_on:
      mose-sandbox:
        condition: service_healthy
      # Code Mode: agent MCP is only mcp-portal (docker exec). Upstream sidecars
      # are started by the portal service.
      mose-mcp-portal:
        condition: service_started
    environment:
      TERMINAL_BACKEND: docker
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://host.docker.internal:5000/v1}
      LLM_MODEL: ${LLM_MODEL:-model}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_OMIT_TEMPERATURE: ${LLM_OMIT_TEMPERATURE:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      SIGNAL_PHONE: ${SIGNAL_PHONE:-}
      SIGNAL_ENGAGEMENT_GROUP_ID: ${SIGNAL_ENGAGEMENT_GROUP_ID:-}
      SIGNAL_ADMIN_GROUP_ID: ${SIGNAL_ADMIN_GROUP_ID:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      UPCOMING_ENABLED: ${UPCOMING_ENABLED:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      # Code Mode: POST /approve for mutating MCP (portal reaches this via mose-net).
      MOSE_PORTAL_ENABLED: "1"
    # extra_hosts maps host.docker.internal on Linux (native on macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mose-data:/app/data
      - mose-workspace:/app/data/workspace
      # Approved skills, pending proposals, and rejections (see INSTALL.md A.5.4).
      - mose-skills:/app/skills
      # Required for TERMINAL_BACKEND=docker so mose-agent can `docker exec`
      # into mose-sandbox. The `mose` user is added to the `docker` group at
      # build time; for tighter deployments front the socket with a proxy.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # mose-net: outbound (LLM, sidecars). mose-codemode-net: portal posts to
      # POST /approve here for mutating Code Mode MCP calls.
      - mose-net
      - mose-codemode-net
    restart: unless-stopped

  # One-shot service: run a skill-quality review and exit. Invoked from a
  # systemd timer on the host (see ops/systemd/mose-skill-review.*).
  mose-skill-review:
    build:
      context: .
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    profiles: ["review"]
    depends_on:
      mose-sandbox:
        condition: service_healthy
    environment:
      TERMINAL_BACKEND: docker
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://host.docker.internal:5000/v1}
      LLM_MODEL: ${LLM_MODEL:-model}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_OMIT_TEMPERATURE: ${LLM_OMIT_TEMPERATURE:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SIGNAL_PHONE: ${SIGNAL_PHONE:-}
      SIGNAL_ENGAGEMENT_GROUP_ID: ${SIGNAL_ENGAGEMENT_GROUP_ID:-}
      SIGNAL_ADMIN_GROUP_ID: ${SIGNAL_ADMIN_GROUP_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mose-data:/app/data
      - mose-workspace:/app/data/workspace
      - mose-skills:/app/skills
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mose-net
    command: ["python", "-m", "mose", "--skill-review"]

networks:
  mose-net:
    driver: bridge
  mose-codemode-net:
    driver: bridge
    internal: true

volumes:
  mose-data:
  mose-workspace:
  mose-skills:
